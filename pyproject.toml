[project]
name = "cooking-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Vera Adzhieva",email = "vera.adzhieva3003@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)",
    "langchain-openai (>=1.6.0,<2.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "python-telegram-bot (>=22.8,<23.0)",
    "langchain (>=1.3.17,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"